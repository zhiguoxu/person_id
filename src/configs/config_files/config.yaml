# ==============================================================================
# 基底配置 (所有环境共享, 进 git), 会被 config_{APP_ENV}.yaml 深合并覆盖
# (APP_ENV 默认 dev; APP_ 前缀环境变量可再覆盖顶层字段)。
#
# 配置分工约定 (与 voice_server 一致):
#   所有配置都写在本文件 (与代码默认值一致的项可不写, 默认值见
#   src/configs/config.py)。环境 yaml (config_{APP_ENV}.yaml, 已 gitignore)
#   只放四类字段, 经 deep_merge 覆盖基底:
#     1. 数据库 url / 路径 (db_url, gallery_db_path)
#     2. redis 连接 (host / password / db), 以及与本环境 voice_server 实例
#        耦合的 voice_online_redis_db / voice_live_namespace
#     3. 各类密钥 (vlm.api_key)
#     4. 环境专属地址与资源 (hardware.device 这类随部署机器变化的项——
#        写进基底会被其他环境静默继承, 漏覆盖就串环境, 所以按环境隔离)
#     5. 本实例监听的 host / port (随部署实例变化)
#   注: 服务自身参数原收在 server.* 子块, 已扁平到顶层(与 voice/agent 一致)
#   密钥字段在本文件留空串占位, 真值一律在环境 yaml 覆盖。
# ==============================================================================

# 匹配与融合 (MatchingConfig): 调参最频繁的一组, 集中放 yaml 便于管理。
# 值与 config.py 默认一致; 改这里重启生效 (控制台 Controls 在线调的是内存值,
# 重启后回落到本文件)。字段名须与 config.py 完全一致 (大小写敏感)。
matching:
  # 四级置信度阈值 (A > B > C, 无 D)
  A_threshold: 0.85          # 笃定 (唯一终态)
  A_margin: 0.20             # 笃定所需最小 margin
  B_threshold: 0.72          # 确定
  B_margin: 0.10             # 确定所需最小 margin
  C_threshold: 0.55          # 怀疑/陌生 分界线
  # Body Top-K Blend
  blend_alpha: 0.7           # peak 权重 (1-α 为 depth 权重)
  cross_pose_discount: 0.7   # 跨姿态投票权折扣 (同姿态=1.0)
  wardrobe_boost_gamma: 0.2  # wardrobe 提升因子 (贝叶斯 lift ≈ 1.5×)
  # 多模态融合基础权重
  face_base_weight: 0.7      # 人脸
  body_base_weight: 0.2      # 全身
  proportion_base_weight: 0.1  # 体型比例
  # Sigmoid 门控 (各模态独立校准)
  face_gate_q0: 0.3          # 人脸质量翻转点
  face_gate_k: 10.0          # 人脸质量门控斜率
  body_gate_q0: 0.5          # 人体质量翻转点
  body_gate_k: 10.0          # 人体质量门控斜率

# VLM 仲裁 (Tier3)。enabled 默认 false (见 config.py), 启用的环境自行覆盖
vlm:
  api_key: ""  # 密钥, 在环境 yaml 覆盖; 不启用 VLM 的环境保持空串即可
  # 国际站 endpoint, 与 api_key 的开通账号匹配 (代码默认值是国内站)
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

# 声音 embedding 提取 (VoiceEmbedExtractorConfig): voice_server 每轮对话经
# /api/voice/embed 调用。值与 config.py 默认一致; 配方参数依据
# test/speaker_id/ 评测锁定 (recipe_findings.md), 一般无需改动。
# model_path 不在此配置: 默认取代码内 MODELS_DIR 下的 ONNX, 缺失自动下载;
# 需要指定时在环境 yaml 覆盖 (随部署机器变化)
voice_embed:
  enabled: true
  provider: cuda        # cuda / cpu (H20 实测 6.8ms vs CPU 37ms)
  num_threads: 4        # 仅 provider=cpu 时生效
  # 子段平均配方参数
  seg_window_sec: 3.0
  seg_hop_sec: 1.5

# Redis 连接参数 (RedisConfig 全字段必填、无代码默认)。
# host(环境地址)/password(密钥)/db(环境隔离)在环境 yaml 覆盖, 缺失起不来 (fail-fast)
redis:
  port: 6379
  socket_connect_timeout: 5
  socket_timeout: 5
  max_connections: 1000

log_stream:
  stream_key: "voice_agent:logs:stream"
  db: 1
  maxlen: 100000
