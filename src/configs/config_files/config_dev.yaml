# ==============================================================================
# dev 环境覆盖 (GPU 服务机 1.15.11.133 / 内网 172.17.0.11)
# 深合并在 config.yaml 之上; APP_ 前缀环境变量优先级更高。
# ==============================================================================

# 配置在线编辑(DB 覆盖层)的存储, 与 voice/agent 同款 session_store 表结构。
# 相对路径 = 相对服务启动目录(项目根)。切共享 MySQL 时只改这一行:
#   db_url: "mysql+aiomysql://user:pass@host:3306/dbname"
db_url: "sqlite+aiosqlite:///./data/person_id_store.db"

# GPU 服务机只有 2 张卡 (H20 ×2), 代码默认的 cuda:2 是训练机口径, 在此无效;
# GPU0 已被其他服务占约 60G, 用 GPU1。必须写在 yaml 里: config.py 不读 .env,
# 远端手改 config.py 会被部署覆盖 (2026-08-05 曾因此全线 invalid device ordinal)
hardware:
  device: cuda:1

# VLM 仲裁 (原 .env 的 VLM_API_KEY / VLM_BASE_URL)
vlm:
  api_key: sk-02540142632e4c62a967430506055cb4
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

# Redis: 与 voice_server dev 同一实例 (拉流期望状态存 redis.db;
# 设备在线标记在 voice_server 主库, 见 server.voice_online_redis_db)
redis:
  host: 172.17.16.82
  port: 6379
  password: joyinai_2025
  db: 0

server:
  # voice_server 在线标记所在 db 与命名空间, 须与 voice_server 的
  # redis.db / live_namespace 一致, 否则重推流前的在线检查会误判"不在线"
  voice_online_redis_db: 2
  voice_live_namespace: default
  # 特征底库 sqlite (人脸/人体/衣橱特征)。相对路径 = 相对服务启动目录(项目根);
  # data/ 为远端运行态, 部署时不同步不覆盖 (参考 voice_server 把 db_url 放 dev yaml 的做法)
  gallery_db_path: data/gallery.db
